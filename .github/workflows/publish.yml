name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected package version
        required: true
        default: "0.10.0"
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "release" ]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          else
            EXPECTED_VERSION="${{ inputs.version }}"
          fi
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match expected $EXPECTED_VERSION"
            exit 1
          fi

      - name: Run quality gate
        run: npm run check

      - name: Check whether version is already published
        id: npm-version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published. Skipping duplicate publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published yet."
          fi

      - name: Publish to npm with OIDC
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public
      - name: Wait for npm registry processing
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          for attempt in {1..18}; do
            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is publicly available."
              exit 0
            fi
            echo "Waiting for npm registry processing (attempt $attempt/18)..."
            sleep 10
          done
          echo "$PACKAGE_NAME@$PACKAGE_VERSION did not become visible in time."
          exit 1

      - name: Install and verify MCP Registry publisher
        shell: bash
        run: |
          curl -fsSL             "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"             -o /tmp/mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate server.json

      - name: Authenticate to MCP Registry with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: /tmp/mcp-publisher publish server.json
